<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Translator Desktop</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      margin:0;
      padding:0;
      height:100%;
      width:100%;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background:#f5f5f5;
      overflow:hidden;
    }

    /* 左侧导航栏 */
    .sidebar {
      width:260px;
      height:100%;
      position:fixed;
      top:0;
      left:0;
      background:#1a1a2e;
      color:#fff;
      display:flex;
      flex-direction:column;
      z-index:10;
      overflow-y:auto;
    }

    .sidebar-header {
      padding:24px 20px;
      font-size:18px;
      font-weight:bold;
      border-bottom:1px solid #2d2d4a;
      margin-bottom:10px;
    }

    .nav {
      margin:5px 15px;
      padding:14px 18px;
      cursor:pointer;
      border-radius:12px;
      color:#94a3b8;
      font-size:15px;
      transition:all 0.2s;
    }

    .nav:hover {
      background:#2d2d4a;
      color:#fff;
    }

    .nav.active {
      background:#2563eb;
      color:#fff;
    }

    /* 主内容区 */
    .main-content {
      margin-left:260px;
      height:100vh;
      width:calc(100% - 260px);
      background:#fff;
    }

    #telegramContainer {
      width:100%;
      height:100%;
      background:#fff;
    }

    /* 右下角提示（不遮挡） */
    .floating-tip {
      position:fixed;
      bottom:20px;
      right:20px;
      background:#2AABEE;
      color:#fff;
      padding:8px 14px;
      border-radius:20px;
      z-index:999999;
      font-size:12px;
      opacity:0.9;
      pointer-events:none;
    }

    /* 右侧功能面板 - 默认隐藏，点击导航时显示 */
    .result-panel {
      position:fixed;
      bottom:80px;
      right:20px;
      width:320px;
      background:white;
      border-radius:16px;
      box-shadow:0 4px 20px rgba(0,0,0,0.15);
      z-index:999998;
      border:1px solid #e2e8f0;
      overflow:hidden;
      display: none;
    }

    .result-header {
      background:#2563eb;
      color:white;
      padding:12px 16px;
      font-weight:bold;
      font-size:14px;
      cursor: move;
    }

    .result-content {
      padding:16px;
      min-height:60px;
      max-height:150px;
      overflow-y:auto;
      font-size:13px;
      color:#1e293b;
      background:#fafcff;
    }

    /* 输入区域（在结果面板内） */
    .input-area {
      border-top:1px solid #eef2ff;
      padding:12px;
    }

    .input-area textarea {
      width:100%;
      padding:10px;
      border:1px solid #cbd5e1;
      border-radius:20px;
      resize:none;
      font-size:13px;
      font-family:inherit;
    }

    .input-area textarea:focus {
      outline:none;
      border-color:#2563eb;
    }

    .button-group {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }

    .button-group button {
      background:#f1f5f9;
      border:1px solid #cbd5e1;
      padding:6px 12px;
      border-radius:20px;
      cursor:pointer;
      font-size:12px;
      transition:all 0.2s;
    }

    .button-group button:hover {
      background:#e2e8f0;
    }

    .button-group button.primary {
      background:#2563eb;
      border-color:#2563eb;
      color:white;
    }

    .button-group button.primary:hover {
      background:#1d4ed8;
    }

    /* 子设置面板 */
    .sub-settings {
      display:none;
      border-top:1px solid #eef2ff;
      padding:12px;
      background:#f8fafc;
    }

    .sub-settings h4 {
      font-size:13px;
      margin-bottom:10px;
      color:#1e293b;
    }

    .sub-settings label {
      font-size:12px;
      display:block;
      margin-top:8px;
      color:#475569;
    }

    .sub-settings select, .sub-settings textarea {
      width:100%;
      padding:6px;
      border-radius:12px;
      border:1px solid #cbd5e1;
      margin-top:4px;
    }

    .sub-settings button {
      margin-top:12px;
      width:100%;
      background:#fee2e2;
      color:#dc2626;
      border:none;
      padding:8px;
      border-radius:20px;
      cursor:pointer;
    }

    /* 关闭按钮 */
    .close-panel {
      float: right;
      cursor: pointer;
      background: none;
      border: none;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<!-- 左侧导航栏 -->
<div class="sidebar">
  <div class="sidebar-header">🤖 AI 客服助手</div>
  <div class="nav active" data-page="chat">💬 智能聊天</div>
  <div class="nav" data-page="translate">🌎 美式英语翻译</div>
  <div class="nav" data-page="reply">🤖 AI 回复设置</div>
  <div class="nav" data-page="offwork">🕘 下班模式</div>
  <div class="nav" data-page="analysis">📊 客户分析</div>
  <div class="nav" data-page="brief">📋 每日简报</div>
</div>

<!-- 主内容：Telegram Webview -->
<div class="main-content">
  <div id="telegramContainer"></div>
</div>

<!-- 右下角提示（不遮挡） -->
<div class="floating-tip" id="floatingTip">
  🤖 AI 翻译助手已就绪
</div>

<!-- 右侧功能面板 -->
<div class="result-panel" id="resultPanel">
  <div class="result-header" id="panelTitle">
    💬 智能聊天
    <button class="close-panel" id="closePanelBtn">✕</button>
  </div>
  <div class="result-content" id="resultContent">等待操作...</div>
  <div class="input-area">
    <textarea id="inputArea" rows="2" placeholder="输入中文或英文内容..."></textarea>
    <div class="button-group" id="buttonGroup"></div>
  </div>
  <div id="subSettings" class="sub-settings"></div>
</div>

<script>
window.addEventListener("DOMContentLoaded", () => {
  // ========== API 公网地址 ==========
  const API_BASE = 'https://ai-v2zo.onrender.com';
  
  // ========== Telegram Webview 嵌入 ==========
  const container = document.getElementById("telegramContainer");
  container.innerHTML = `
    <webview
      id="telegramWebview"
      src="https://web.telegram.org/k/"
      style="width:100%;height:100%;border:none;"
    ></webview>
  `;

  const webview = document.getElementById("telegramWebview");
  const floatingTip = document.getElementById("floatingTip");

  webview.addEventListener("dom-ready", () => {
    floatingTip.innerText = "✅ AI 翻译助手已注入";

    webview.executeJavaScript(`
      if (!window.__AI_TRANSLATOR_ACTIVE__) {
        window.__AI_TRANSLATOR_ACTIVE__ = true;
        console.log("AI 翻译监听已启动");

        const API_URL = "https://ai-v2zo.onrender.com/api/translate";

        async function aiTranslate(text) {
          try {
            const res = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text, style: "friendly" })
            });
            const data = await res.json();
            return data.translated || data.result || text;
          } catch (err) {
            return text;
          }
        }

        function cleanText(text) {
          if (!text) return "";
          return text.replace(/🌐 中文：.*$/s, "").trim();
        }

        function isChinese(text) {
          return /[\\u4e00-\\u9fa5]/.test(text);
        }

        function addTranslation(messageEl, translated) {
          if (!messageEl || messageEl.querySelector(".ai-translation-box")) return;
          const box = document.createElement("div");
          box.className = "ai-translation-box";
          box.innerText = "🌐 中文：" + translated;
          box.style.cssText = "margin-top:6px;padding:6px 10px;background:#e8f3ff;color:#0f4c81;border-radius:10px;font-size:13px;";
          messageEl.appendChild(box);
        }

        async function scanMessages() {
          const candidates = document.querySelectorAll(".Message, .message, [class*=Message], [class*=message]");
          for (const msg of candidates) {
            if (msg.dataset.aiTranslated === "1") continue;
            const text = cleanText(msg.innerText || "");
            if (!text || text.length < 2) continue;
            msg.dataset.aiTranslated = "1";
            if (isChinese(text)) continue;
            const translated = await aiTranslate(text);
            addTranslation(msg, translated);
          }
        }
        setInterval(scanMessages, 3000);
      }
    `).catch(err => console.error("注入失败:", err));
  });

  // ========== API 调用函数（使用公网地址）==========
  let currentUser = "user_" + Date.now();

  async function callAPI(url, data) {
    try {
      const res = await fetch(`${API_BASE}${url}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      return await res.json();
    } catch (err) {
      console.error('API调用失败:', err);
      return { error: err.message };
    }
  }

  async function doTranslate() {
    const text = document.getElementById('inputArea').value.trim();
    if (!text) { document.getElementById('resultContent').innerHTML = "❌ 请输入内容"; return; }
    document.getElementById('resultContent').innerHTML = "🔄 翻译中...";
    const data = await callAPI('/api/translate', { text });
    document.getElementById('resultContent').innerHTML = `✨ 美式翻译:<br>${data.translated || text}`;
  }

  async function doAnalyze() {
    document.getElementById('resultContent').innerHTML = "📊 分析中...";
    const data = await callAPI('/api/customer-analysis', { customerId: currentUser });
    document.getElementById('resultContent').innerHTML = `
      📊 ${data.stageLabel || '客户分析'}<br>
      对话次数: ${data.chatCount || 0}次<br>
      兴趣: ${(data.interests || []).join(',') || '暂无'}<br>
      情绪: ${data.mood || '未知'}
    `;
  }

  async function doBrief() {
    document.getElementById('resultContent').innerHTML = "📋 生成中...";
    const data = await callAPI('/api/daily-brief', { customerId: currentUser });
    document.getElementById('resultContent').innerHTML = data.brief || "今日无数据";
  }

  async function doReply() {
    const text = document.getElementById('inputArea').value.trim();
    if (!text) { document.getElementById('resultContent').innerHTML = "❌ 请输入客户消息"; return; }
    document.getElementById('resultContent').innerHTML = "💡 生成中...";
    const data = await callAPI('/chat', { message: text, customerId: currentUser });
    document.getElementById('resultContent').innerHTML = `💡 AI回复:<br>${data.reply || '无响应'}`;
  }

  async function doSend() {
    const text = document.getElementById('inputArea').value.trim();
    if (!text) return;
    document.getElementById('inputArea').value = '';
    document.getElementById('resultContent').innerHTML = "⏳ 发送中...";
    const data = await callAPI('/chat', { message: text, customerId: currentUser });
    document.getElementById('resultContent').innerHTML = `🤖 回复:<br>${data.reply || '已发送'}`;
  }

  // ========== 页面切换 ==========
  const panel = document.getElementById('resultPanel');
  const panelTitle = document.getElementById('panelTitle');
  const resultContent = document.getElementById('resultContent');
  const buttonGroup = document.getElementById('buttonGroup');
  const subSettings = document.getElementById('subSettings');

  document.getElementById('closePanelBtn').addEventListener('click', () => {
    panel.style.display = 'none';
  });

  function switchTo(page) {
    panel.style.display = 'block';
    
    const titles = {
      chat: '💬 智能聊天',
      translate: '🌎 美式英语翻译',
      reply: '🤖 AI 回复设置',
      offwork: '🕘 下班模式',
      analysis: '📊 客户分析',
      brief: '📋 每日简报'
    };
    panelTitle.innerText = titles[page] || 'AI 客服助手';
    
    buttonGroup.innerHTML = '';
    subSettings.style.display = 'none';
    subSettings.innerHTML = '';

    if (page === 'chat') {
      buttonGroup.innerHTML = `
        <button class="primary" id="sendChatBtn">💬 发送消息</button>
        <button id="clearChatBtn">🗑 清空</button>
      `;
      document.getElementById('sendChatBtn')?.addEventListener('click', doSend);
      document.getElementById('clearChatBtn')?.addEventListener('click', () => {
        document.getElementById('inputArea').value = '';
        resultContent.innerHTML = '输入消息后点击发送';
      });
      resultContent.innerHTML = '输入消息，AI会自动回复';
    } 
    else if (page === 'translate') {
      buttonGroup.innerHTML = `<button class="primary" id="translateBtn">🔍 翻译</button>`;
      document.getElementById('translateBtn')?.addEventListener('click', doTranslate);
      resultContent.innerHTML = '输入中文或英文，点击翻译';
    }
    else if (page === 'reply') {
      buttonGroup.innerHTML = `<button id="genReplyBtn">✨ 生成AI回复</button>`;
      document.getElementById('genReplyBtn')?.addEventListener('click', doReply);
      resultContent.innerHTML = '输入客户消息，生成AI回复草稿';
      
      subSettings.style.display = 'block';
      subSettings.innerHTML = `
        <h4>⚙️ AI 回复设置</h4>
        <label>回复速度</label>
        <select id="replySpeed">
          <option value="fast">⚡ 快速</option>
          <option value="normal" selected>🕐 正常</option>
          <option value="slow">🐢 慢速</option>
        </select>
        <label>主动延伸频率</label>
        <select id="proactiveRate">
          <option value="low">低 (15%)</option>
          <option value="normal" selected>正常 (30%)</option>
          <option value="high">高 (50%)</option>
        </select>
        <button id="resetMemoryBtn">🔄 重置客户记忆</button>
      `;
      document.getElementById('resetMemoryBtn')?.addEventListener('click', () => {
        resultContent.innerHTML = "✅ 客户记忆已重置";
      });
    }
    else if (page === 'offwork') {
      buttonGroup.innerHTML = `<button id="saveOffworkBtn">💾 保存设置</button>`;
      document.getElementById('saveOffworkBtn')?.addEventListener('click', () => {
        const msg = document.getElementById('offworkMsg')?.value || "Hey! I'm away right now.";
        localStorage.setItem('awayMessage', msg);
        resultContent.innerHTML = "✅ 下班设置已保存";
      });
      
      subSettings.style.display = 'block';
      subSettings.innerHTML = `
        <h4>🕘 下班模式设置</h4>
        <div style="display:flex; justify-content:space-between; margin:10px 0;">
          <span>🤖 自动回复</span>
          <input type="checkbox" id="autoReplyMode">
        </div>
        <label>自动回复延迟</label>
        <select id="autoReplyDelay">
          <option value="instant">即时</option>
          <option value="normal" selected>30秒后</option>
          <option value="slow">1-3分钟</option>
        </select>
        <label>下班问候语</label>
        <textarea id="offworkMsg" rows="2">Hey! I'm away right now. I'll get back to you soon 😊</textarea>
      `;
      const savedMsg = localStorage.getItem('awayMessage');
      if (savedMsg) document.getElementById('offworkMsg').value = savedMsg;
    }
    else if (page === 'analysis') {
      buttonGroup.innerHTML = `<button class="primary" id="analyzeBtn">📊 开始分析</button>`;
      document.getElementById('analyzeBtn')?.addEventListener('click', doAnalyze);
      resultContent.innerHTML = '点击按钮分析当前客户';
    }
    else if (page === 'brief') {
      buttonGroup.innerHTML = `<button class="primary" id="briefBtn">📋 生成简报</button>`;
      document.getElementById('briefBtn')?.addEventListener('click', doBrief);
      resultContent.innerHTML = '点击按钮生成每日简报';
    }
  }

  document.querySelectorAll('.nav').forEach(nav => {
    nav.addEventListener('click', () => {
      document.querySelectorAll('.nav').forEach(n => n.classList.remove('active'));
      nav.classList.add('active');
      const page = nav.getAttribute('data-page');
      switchTo(page);
    });
  });

  switchTo('chat');
});
</script>

</body>
</html>
